<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/prijava.css">
</head>
<body>
    <main class="ekran">
        <section class="opis">
            <img class="talas" src="slike/Vector2.svg" alt="">
            <form class="sadrzaj">
                <h1>Prijava</h1>
                <div class="polje">
                    <label for="email">Email</label>
                    <div class="unos">
                     <img src="slike/EnvelopeEmail.svg" alt="">
                     <input type="email" name="email" id="email" placeholder="Unesite email adresu">   
                    </div>
                </div>
                <div class="polje">
                    <label for="password">Lozinka</label>
                    <div class="unos">
                     <img src="slike/KljucSifra.svg" alt="">
                     <input type="password" name="lozinka" id="lozinka" placeholder="Unesite lozinku">   
                    </div>
                </div>
                <div class="redSaOpcijama">
                    <label class="zapamti">
                        <input type="checkbox" name="zapamti" id="zapamti">
                        <span>Zapamti</span>
                    </label>
                    <a class="zaboravljenaLozinka" href="zaboravljenaLozinka.html">Zaboravljena lozinka?</a>
                </div>
                <p class="greska" id="greska" role="alert" hidden></p>
                <button class="dugme" type="submit" id="dugmePrijava" disabled>Prijavi se</button>
                <p class="registracija">Nemate nalog? <a href="registracija.html">Registrujte se</a></p>

            </form>

        </section>
    </main>

    
</body>
</html>
